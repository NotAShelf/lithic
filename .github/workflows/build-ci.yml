name: Build CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Tests
        run: cargo test --workspace

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: lithic-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: lithic-windows-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: lithic-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: lithic-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev libxkbcommon-dev libwayland-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package lithic --package lithic-cli --package lithic-gui

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.target }}/release/lithic${{ runner.os == 'Windows' && '.exe' || '' }}
            target/${{ matrix.target }}/release/lithic-cli${{ runner.os == 'Windows' && '.exe' || '' }}
            target/${{ matrix.target }}/release/lithic-gui${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
