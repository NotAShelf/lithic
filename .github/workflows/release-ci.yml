name: Release CI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: lithic-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: lithic-windows-x86_64

          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: lithic-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: lithic-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly-2026-07-17"
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev libxkbcommon-dev libwayland-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package lithic --package lithic-cli --package lithic-gui

      - name: Stage files
        shell: bash
        run: |
          mkdir dist
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          for bin in lithic lithic-cli lithic-gui; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" dist/
          done
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packages/lithic-cli/lithic.desktop dist/
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create platform archives
        run: |
          mkdir -p archives
          cd release-artifacts
          for dir in */; do
            platform=$(basename "$dir")
            (
              cd "$dir"
              if [[ "$platform" != lithic-windows-* ]]; then
                chmod +x lithic lithic-cli lithic-gui
              fi
              zip -9 "../../archives/${platform}.zip" ./*
            )
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: archives/*
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
