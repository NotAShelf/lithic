[workspace]
members  = [ "packages/*", "crates/*" ]
resolver = "3"

[workspace.package]
version      = "1.0.3"
edition      = "2024"
rust-version = "1.95.0"
license      = "MPL-2.0"
readme       = "./docs/README.md"
description  = "A mod manager for Vintage Story"
homepage     = "https://github.com/NotAShelf/lithic"
repository   = "https://github.com/NotAShelf/lithic"

[workspace.dependencies]
# Workspace components
lithic-cli    = { path = "packages/lithic-cli", version = "1.0.3" }
lithic-core   = { path = "crates/lithic-core", version = "1.0.3" }
lithic-gui    = { path = "packages/lithic-gui", version = "1.0.3" }
lithic-locale = { path = "crates/lithic-locale", version = "1.0.3" }

chrono = { version = "0.4.45" }
clap = { version = "4.6.7", features = [ "color", "suggestions", "derive" ] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
dirs = { version = "7.0.0" }
flate2 = "1"
futures = "0.3.34"
html2text = "0.17.1"
indicatif = { version = "0.18.6", features = [ "tokio" ] }
keyring = "4.2.0"
lenient_semver = "0.4.2"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", features = [ "json", "default-tls" ], default-features = false }
rpassword = "7"
semver = "1.0.28"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
serde_json5 = { version = "0.2.1" }
shell-words = "1.1.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "fs",
  "rt-multi-thread",
  "macros",
  "io-util",
  "process",
  "sync",
  "time",
] }
toml = { version = "1.1.6", features = [ "preserve_order" ] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }
zip = { version = "8.6.0", default-features = false, features = [ "deflate" ] }

# GUI deps
iced              = { version = "0.14.0", features = [ "tokio", "image", "svg", "sipper" ] }
native-theme-iced = "0.5.9"
opener            = "0.8.5"
rfd               = { version = "0.17.2", default-features = false, features = [ "xdg-portal" ] }

# Translations
fluent      = "0.17.0"
unic-langid = { version = "0.9.6", features = [ "macros" ] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release.package."*"]
codegen-units = 1
opt-level     = 3

[profile.release]
codegen-units = 1
debug         = false
lto           = "thin"
opt-level     = 3
panic         = "abort"
strip         = "symbols"
