[workspace]
members  = [ "packages/*", "crates/*" ]
resolver = "3"

[workspace.package]
version      = "1.0.2"
edition      = "2024"
rust-version = "1.95.0"
license      = "MPL-2.0"
readme       = "./docs/README.md"
description  = "A mod manager for Vintage Story"
homepage     = "https://github.com/NotAShelf/lithic"
repository   = "https://github.com/NotAShelf/lithic"

[workspace.dependencies]
lithic-cli    = { path = "packages/lithic-cli", version = "1.0.2" }
lithic-core   = { path = "crates/lithic-core", version = "1.0.2" }
lithic-gui    = { path = "packages/lithic-gui", version = "1.0.2" }
lithic-locale = { path = "crates/lithic-locale", version = "1.0.2" }

fluent        = "0.17.0"
fluent-syntax = "0.12.0"
unic-langid   = { version = "0.9.6", features = [ "macros" ] }

async_zip          = { version = "0.0.18", features = [ "tokio", "tokio-fs", "deflate" ] }
chrono             = { version = "0.4.45" }
clap               = { version = "4.6.1", features = [ "color", "suggestions", "derive" ] }
clap_complete      = "4.6.7"
color-eyre         = "0.6.5"
comfy-table        = "7.2.2"
csv                = "1.4.0"
dirs               = { version = "6.0.0" }
futures            = "0.3.32"
html2text          = "0.17.1"
human_format       = "1.2.1"
indexmap           = { version = "2.14.0", features = [ "serde" ] }
indicatif          = { version = "0.18.6", features = [ "tokio" ] }
is_elevated        = "0.1.2"
lenient_semver     = "0.4.2"
num_cpus           = "1.17.0"
reqwest            = { version = "0.13.4", features = [ "json", "default-tls" ], default-features = false }
semver             = "1.0.28"
serde              = { version = "1.0.228", features = [ "derive" ] }
serde_json         = "1.0.150"
serde_json5        = { version = "0.2.1" }
thiserror          = "2.0.18"
tokio              = { version = "1.52.3", features = [ "fs", "rt-multi-thread", "macros", "io-util", "process" ] }
toml               = { version = "1.1.2", features = [ "preserve_order" ] }
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }
url                = "2.5.8"
uuid               = { version = "1.23.5", features = [ "v4" ] }
yansi              = "1.0.1"

iced              = { version = "0.14.0", features = [ "tokio" ] }
native-theme      = "0.5.7"
native-theme-iced = "0.5.7"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release.package."*"]
codegen-units = 1
opt-level     = 3

[profile.release]
codegen-units = 1
debug         = false
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = "symbols"
