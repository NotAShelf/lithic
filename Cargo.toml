[workspace]
members  = [ "packages/*", "crates/*" ]
resolver = "3"

[workspace.package]
version      = "2.0.0"
edition      = "2024"
rust-version = "1.97.1"
license      = "MPL-2.0"
readme       = "./docs/README.md"
description  = "A mod manager for Vintage Story"
homepage     = "https://github.com/NotAShelf/lithic"
repository   = "https://github.com/NotAShelf/lithic"

[workspace.dependencies]
# Workspace components
lithic-cli    = { path = "packages/lithic-cli", version = "2.0.0" }
lithic-core   = { path = "crates/lithic-core", version = "2.0.0" }
lithic-gui    = { path = "packages/lithic-gui", version = "2.0.0" }
lithic-icons  = { path = "crates/lithic-icons", version = "2.0.0" }
lithic-locale = { path = "crates/lithic-locale", version = "2.0.0" }

clap = { version = "4.6.7", features = [ "color", "suggestions", "derive" ] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
dirs = { version = "7.0.0" }
flate2 = "1.1.10"
futures = "0.3.34"
html2text = "0.17.1"
indicatif = { version = "0.18.6", features = [ "tokio" ] }
ini-edit = "0.3.2"
jiff = "0.2.37"
keyring = "4.2.0"
lenient_semver = "0.4.2"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", features = [ "json", "default-tls" ], default-features = false }
rpassword = "7"
semver = "1.0.28"
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
serde_json5 = { version = "0.2.1" }
shell-words = "1.1.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "fs",
  "rt-multi-thread",
  "macros",
  "io-util",
  "process",
  "sync",
  "time",
] }
toml = { version = "1.1.6", features = [ "preserve_order" ] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }
zip = { version = "8.6.0", default-features = false, features = [ "deflate" ] }

# GUI deps
iced              = { version = "0.14.0", features = [ "tokio", "image", "svg", "sipper" ] }
native-theme-iced = "0.5.9"
opener            = "0.9.0"
rfd               = { version = "0.17.2", default-features = false, features = [ "xdg-portal" ] }

# Translations
fluent      = "0.17.0"
unic-langid = { version = "0.9.6", features = [ "macros" ] }

# See:
#  <https://doc.rust-lang.org/rustc/lints/listing/allowed-by-default.html>
[workspace.lints.clippy]
cargo      = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery    = { level = "warn", priority = -1 }
pedantic   = { level = "warn", priority = -1 }
perf       = { level = "warn", priority = -1 }
style      = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# The lint groups above enable some less-than-desirable rules, we should manually
# enable those to keep our sanity.
absolute_paths                       = "deny"
allow_attributes                     = "deny"
allow_attributes_without_reason      = "deny"
arbitrary_source_item_ordering       = "allow"
clone_on_ref_ptr                     = "warn"
dbg_macro                            = "warn"
disallowed_methods                   = "deny"
disallowed_types                     = "deny"
empty_drop                           = "warn"
empty_structs_with_brackets          = "warn"
excessive_nesting                    = "warn"
exit                                 = "warn"
filetype_is_file                     = "warn"
get_unwrap                           = "warn"
implicit_return                      = "allow"
infinite_loop                        = "warn"
iter_on_single_items                 = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_docs_in_private_items        = "allow"
multiple_crate_versions              = "allow" # :(
non_ascii_literal                    = "allow"
non_std_lazy_statics                 = "warn"
non_zero_suggestions                 = "warn"
pathbuf_init_then_push               = "warn"
pattern_type_mismatch                = "allow"
precedence_bits                      = "warn"
pub_underscore_fields                = "warn"
question_mark_used                   = "allow"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
redundant_clone                      = "warn"
rest_pat_in_fully_bound_structs      = "warn"
self_named_module_files              = "warn"
significant_drop_in_scrutinee        = "warn"
similar_names                        = "allow"
single_call_fn                       = "allow"
std_instead_of_core                  = "allow"
suspicious_operation_groupings       = "warn"
too_long_first_doc_paragraph         = "allow"
too_many_lines                       = "allow"
undocumented_unsafe_blocks           = "warn"
unnecessary_safety_comment           = "warn"
unused_peekable                      = "warn"
unused_result_ok                     = "warn"
unused_trait_names                   = "allow"

# False positive:
# clippy's build script check doesn't recognize workspace-inherited metadata
# which means in our current workspace layout, we get pranked by Clippy.
cargo_common_metadata = "allow"

# In the honor of a recent Cloudflare regression
panic       = "deny"
unwrap_used = "deny"

# Less dangerous, but we'd like to know
# Those must be opt-in, and are fine ONLY in tests and examples.
# We *can* panic but it should be very deliberate.
expect_used   = "warn"
print_stderr  = "warn"
print_stdout  = "warn"
todo          = "warn"
unimplemented = "warn"
unreachable   = "warn"

[workspace.lints.rust]
non_ascii_idents       = "warn" # prevent non-ASCII identifiers
tail_expr_drop_order   = "warn" # catch temporaries dropped in surprising order
unit_bindings          = "warn" # catch useless `let _ = expr` bindings
unsafe_code            = "warn" # guess
unsafe_op_in_unsafe_fn = "warn" # require unsafe blocks even inside unsafe fn
unused_unsafe          = "warn" # catch unnecessary unsafe blocks

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release.package."*"]
codegen-units = 1
opt-level     = 3

[profile.release]
codegen-units = 1
debug         = false
lto           = "thin"
opt-level     = 3
panic         = "abort"
strip         = "symbols"
