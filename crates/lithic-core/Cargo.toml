[package]
name                   = "lithic-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
readme.workspace       = true
description.workspace  = true
homepage.workspace     = true
repository.workspace   = true

[dependencies]
dirs           = { workspace = true }
flate2         = { workspace = true }
futures        = { workspace = true }
html2text      = { workspace = true }
keyring        = { workspace = true, optional = true }
lenient_semver = { workspace = true }
md-5           = { workspace = true }
reqwest        = { workspace = true }
semver         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
serde_json5    = { workspace = true }
shell-words    = { workspace = true }
tar            = { workspace = true }
thiserror      = { workspace = true }
tokio          = { workspace = true }
toml           = { workspace = true }
tracing        = { workspace = true }
zip            = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Store account session secrets in the OS keyring (Secret Service on Linux and
# BSD, Keychain on macOS, Credential Manager on Windows). Without it, or when
# no keyring answers, sessions go to a file only the user can read.
default    = [ "os-keyring" ]
os-keyring = [ "dep:keyring" ]
